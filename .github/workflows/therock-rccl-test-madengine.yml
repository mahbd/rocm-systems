name: TheRock Test MADEngine Workloads for rccl

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
      artifact_run_id:
        type: string
      workload:
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        type: string
        default: '2'
      notify_email:
        type: string
        default: ''
      teams_webhook:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      artifact_run_id:
        description: 'Reuse artifacts from a previous build run ID'
        type: string
      workload:
        description: 'MADEngine workload to run'
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        description: 'Number of SLURM nodes to allocate'
        type: string
        default: '2'
      notify_email:
        description: 'Email address to send test summary report'
        type: string
        default: ''
      teams_webhook:
        description: 'Teams webhook URL for notifications'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test_madengine:
    name: 'Test MADEngine ${{ inputs.workload }} (${{ inputs.nodes }}N)'
    runs-on: ${{ inputs.test_runs_on }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - name: Probe registry access
        run: |
          set +e
          echo "SHARD=${{ matrix.shard }} runner=${RUNNER_NAME} host=$(hostname)"
          echo "  docker: $(docker --version 2>&1 | head -1)"
          echo "  daemon: $(docker info --format '{{.ServerVersion}}' 2>&1 | head -1)"
          echo "--- configured credentials (names only) ---"
          for f in "$HOME/.docker/config.json" /etc/docker/config.json; do
            [ -r "$f" ] && echo "  $f: $(python3 -c "import json,sys;d=json.load(open('$f'));print(list(d.get('auths',{}).keys()), 'credsStore=', d.get('credsStore'))" 2>&1)"
          done
          echo "--- daemon registry config ---"
          docker info 2>/dev/null | grep -iA3 "registry\|mirror" | head -8
          echo "--- reachability ---"
          for r in ghcr.io registry-1.docker.io mkmartifactory.amd.com:8443; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "https://$r/v2/" 2>&1)
            echo "  $r -> HTTP $code"
          done
          echo "--- can GITHUB_TOKEN talk to ghcr? ---"
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>&1 | tail -2
          exit 0
